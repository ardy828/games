# Jujutsu Arena's public server. See README.md for how to deploy it.
name = "jujutsu-arena"
main = "worker.js"
compatibility_date = "2025-09-01"

# Pages allowed to connect, besides localhost. Add your own site here if you host the game elsewhere.
[vars]
ALLOWED_ORIGINS = "https://ardy828.github.io"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# The free plan only offers SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
