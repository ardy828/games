# Jujutsu Arena's public server. See README.md for how to deploy it.
name = "jujutsu-arena"
main = "worker.js"
compatibility_date = "2025-09-01"
# Keep variables set in the Cloudflare dashboard when this deploys from GitHub (secrets are kept anyway).
keep_vars = true

# Sites the game may connect from, besides localhost: "*" lets the game connect from any site. To
# limit it, list addresses instead, e.g. "https://ardy828.github.io,https://*.ardychan828.workers.dev".
[vars]
ALLOWED_ORIGINS = "*"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# The free plan only offers SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
