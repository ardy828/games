<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Addict Games</title>
<meta name="description" content="Browser games: Scrapline and Block Blast.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Chivo+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#0f0f11;
    --panel:#17171a;
    --edge:#2a2a30;
    --ink:#e6e3dd;
    --muted:#8d8a84;
    --rust:#c8552e;
    --amber:#f0a830;
    --pixel:"Silkscreen","Courier New",monospace;
    --mono:"Chivo Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--ground);color:var(--ink);font-family:var(--mono);
    min-height:100vh;padding-inline:20px;padding-block:56px 64px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:34px}
  h1{font-family:var(--pixel);font-weight:700;font-size:clamp(1.9rem,6vw,2.6rem);letter-spacing:.04em;line-height:1}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
  a.card{
    display:flex;flex-direction:column;gap:11px;
    cursor:pointer;-webkit-user-select:none;user-select:none;
    background:var(--panel);border:1px solid var(--edge);border-left:3px solid var(--accent);
    padding:22px 22px 24px;text-decoration:none;color:inherit;
    transition:background 140ms,border-color 140ms,transform 140ms;
  }
  a.card:hover{background:#1d1d21;border-color:var(--accent);transform:translateY(-2px)}
  a.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .card .nm{font-family:var(--pixel);font-weight:700;font-size:1.05rem;letter-spacing:.05em;color:var(--accent)}
  .card .kind{font-family:var(--pixel);font-size:.6rem;letter-spacing:.2em;color:var(--muted)}
  .card .go{font-family:var(--pixel);font-size:.66rem;letter-spacing:.14em;color:var(--ink);margin-top:auto}
  .scrapline{--accent:var(--amber)}
  .blockblast{--accent:#5aa9f7}
</style>
</head>
<body>
<div class="wrap">
  <h1>ADDICT GAMES</h1>

  <div class="grid">
    <a class="card scrapline" href="scrapline/">
      <span class="kind">TOP-DOWN SHOOTER</span>
      <span class="nm">SCRAPLINE</span>
      <span class="go">PLAY →</span>
    </a>

    <a class="card blockblast" href="blockblast/">
      <span class="kind">GRID PUZZLE</span>
      <span class="nm">BLOCK BLAST</span>
      <span class="go">PLAY →</span>
    </a>
  </div>

</div>
</body>
</html>
